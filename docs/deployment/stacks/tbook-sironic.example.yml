# Portainer stack: tBook admin (sironic) + World Darts Festival + Sörfeszt
# Network: external `nginxproxy_default` (routing configured outside this file)
#
# Images (built on engine-v2 by .github/workflows/docker-publish.yml):
#   ghcr.io/tomkoooo/webshop-engine:engine-v2              → apps/tbook
#   ghcr.io/tomkoooo/webshop-engine:world-darts-festival → apps/world-darts-festival
#   ghcr.io/tomkoooo/webshop-engine:sorfeszt             → apps/sorfeszt
#
# Do NOT set DEPLOYMENT_KEY — identity is baked into each image.
#
# Google OAuth redirect for Sörfeszt:
#   https://sor.testsrt.org.hu/api/auth/callback/google
#
# Copy to a gitignored `portainer.stack.yml` (or Portainer UI) and fill secrets.

services:
  tbook-sironic:
    image: ghcr.io/tomkoooo/webshop-engine:engine-v2
    container_name: tbook-sironic
    restart: unless-stopped
    labels:
      - wud.watch=true
      - wud.tag=include
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/feature-flags/maintenance').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - tbook-sironic-uploads:/app/uploads
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: Europe/Budapest

      DATABASE_URL: mongodb://192.168.0.12:27017/tbook-admin
      NEXT_PUBLIC_APP_URL: https://tbook.sironic.hu
      NEXTAUTH_URL: https://tbook.sironic.hu
      AUTH_URL: https://tbook.sironic.hu
      AUTH_SECRET: "changeme"
      AUTH_GOOGLE_ID: "changeme.apps.googleusercontent.com"
      AUTH_GOOGLE_SECRET: "changeme"
      AUTH_TRUST_HOST: "true"

      ENABLE_SHOP: "false"
      MAINTENANCE_MODE: "false"
      NEXT_PUBLIC_MAINTENANCE_MODE: "false"

      BOOTSTRAP_ADMIN_EMAILS: tothtamasb0108@gmail.com

      EMAIL_HOST: smtp.example.com
      EMAIL_PORT: "465"
      EMAIL_USER: noreply@example.com
      EMAIL_PASS: "changeme"
      EMAIL_FROM: noreply@example.com
      EMAIL_FROM_NAME: tBook
      INVOICE_ERROR_ALERT_EMAIL: info@example.com

      TBOOK_API_CORS_ORIGINS: https://worlddartsfestival.com,https://www.worlddartsfestival.com,https://sor.testsrt.org.hu
    networks:
      - nginxproxy_default

  world-darts-festival:
    image: ghcr.io/tomkoooo/webshop-engine:world-darts-festival
    container_name: world-darts-festival
    restart: unless-stopped
    labels:
      - wud.watch=true
      - wud.tag=include
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/feature-flags/maintenance').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - world-darts-festival-uploads:/app/uploads
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: Europe/Budapest

      DATABASE_URL: mongodb://192.168.0.12:27017/world-darts-festival
      NEXT_PUBLIC_APP_URL: https://worlddartsfestival.com
      NEXTAUTH_URL: https://worlddartsfestival.com
      AUTH_URL: https://worlddartsfestival.com
      AUTH_SECRET: "changeme"
      AUTH_GOOGLE_ID: "changeme.apps.googleusercontent.com"
      AUTH_GOOGLE_SECRET: "changeme"
      AUTH_TRUST_HOST: "true"

      ENABLE_SHOP: "false"
      MAINTENANCE_MODE: "false"
      NEXT_PUBLIC_MAINTENANCE_MODE: "false"

      BOOTSTRAP_ADMIN_EMAILS: tothtamasb0108@gmail.com

      EMAIL_HOST: smtp.example.com
      EMAIL_PORT: "465"
      EMAIL_USER: noreply@example.com
      EMAIL_PASS: "changeme"
      EMAIL_FROM: noreply@example.com
      EMAIL_FROM_NAME: World Darts Festival
      INVOICE_ERROR_ALERT_EMAIL: info@example.com

      NEXT_PUBLIC_TBOOK_API_BASE: https://tbook.sironic.hu/api/plugins/t-book
    networks:
      - nginxproxy_default

  sorfeszt:
    image: ghcr.io/tomkoooo/webshop-engine:sorfeszt
    container_name: sorfeszt
    restart: unless-stopped
    labels:
      - wud.watch=true
      - wud.tag=include
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/feature-flags/maintenance').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - sorfeszt-uploads:/app/uploads
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: Europe/Budapest

      DATABASE_URL: mongodb://192.168.0.12:27017/sorfeszt
      NEXT_PUBLIC_APP_URL: https://sor.testsrt.org.hu
      NEXTAUTH_URL: https://sor.testsrt.org.hu
      AUTH_URL: https://sor.testsrt.org.hu
      AUTH_SECRET: "changeme"
      AUTH_GOOGLE_ID: "changeme.apps.googleusercontent.com"
      AUTH_GOOGLE_SECRET: "changeme"
      AUTH_TRUST_HOST: "true"

      ENABLE_SHOP: "false"
      MAINTENANCE_MODE: "false"
      NEXT_PUBLIC_MAINTENANCE_MODE: "false"

      BOOTSTRAP_ADMIN_EMAILS: tothtamasb0108@gmail.com

      EMAIL_HOST: smtp.example.com
      EMAIL_PORT: "465"
      EMAIL_USER: noreply@example.com
      EMAIL_PASS: "changeme"
      EMAIL_FROM: noreply@example.com
      EMAIL_FROM_NAME: Sörfeszt
      INVOICE_ERROR_ALERT_EMAIL: info@example.com

      NEXT_PUBLIC_TBOOK_API_BASE: https://tbook.sironic.hu/api/plugins/t-book
      TBOOK_UPSTREAM_API_BASE: https://tbook.sironic.hu/api/plugins/t-book
    networks:
      - nginxproxy_default

volumes:
  tbook-sironic-uploads:
  world-darts-festival-uploads:
  sorfeszt-uploads:

networks:
  nginxproxy_default:
    external: true
