name: Docker Build and Push

on:
  push:
    branches:
      - engine-v2
      - main
  workflow_dispatch:
    inputs:
      force_all:
        description: Rebuild every site image in this branch catalog
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check docker image matrix mapping
        run: node scripts/ci/resolve-docker-matrix.mjs --self-test

      - name: Typecheck site app (catches core/template TS errors without Docker)
        run: npx tsc --noEmit -p apps/sorfeszt

      - name: Validate deployments
        run: npm run deployments:validate

      - name: Run env-safe unit tests
        run: npm run test:unit -- --exclude tests/unit/order-and-gls-services.test.ts

  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      should_build: ${{ steps.set.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve images to rebuild
        id: set
        run: |
          FORCE_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_all }}" = "true" ]; then
            FORCE_ARGS="--force"
          fi
          node scripts/ci/resolve-docker-matrix.mjs \
            --ref "${{ github.ref }}" \
            --before "${{ github.event.before }}" \
            --sha "${{ github.sha }}" \
            $FORCE_ARGS >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: [test, resolve-matrix]
    if: needs.resolve-matrix.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        id: image_name
        run: echo "value=$(echo '${{ github.repository_owner }}/webshop-engine' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image (${{ matrix.image_tag }})
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.value }}:${{ matrix.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.value }}:sha-${{ github.sha }}-${{ matrix.image_tag }}
          cache-from: type=gha,scope=${{ matrix.image_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_tag }}
          build-args: |
            SITE_APP=${{ matrix.site_app }}
            SITE_APP_SERVER=${{ matrix.site_server }}
            DATABASE_URL=mongodb://localhost:27017/build
            AUTH_GOOGLE_ID=build-placeholder
            AUTH_GOOGLE_SECRET=build-placeholder
            AUTH_SECRET=build-placeholder
            NEXTAUTH_URL=https://placeholder.example.com
            AUTH_TRUST_HOST=true
