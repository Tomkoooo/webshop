name: Docker Build and Push

on:
  push:
    branches:
      - engine-v2
      - main

env:
  REGISTRY: ghcr.io

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.ref }}" = "refs/heads/engine-v2" ]; then
            echo 'matrix={"include":[{"site_app":"apps/tbook","site_server":"apps/tbook/server.js","image_tag":"engine-v2"},{"site_app":"apps/reference","site_server":"apps/reference/server.js","image_tag":"engine-v2-reference"},{"site_app":"apps/world-darts-festival","site_server":"apps/world-darts-festival/server.js","image_tag":"world-darts-festival"},{"site_app":"apps/eventstructure","site_server":"apps/eventstructure/server.js","image_tag":"eventstructure"},{"site_app":"apps/es2","site_server":"apps/es2/server.js","image_tag":"es2"},{"site_app":"apps/dr-zsanett","site_server":"apps/dr-zsanett/server.js","image_tag":"dr-zsanett"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"site_app":"apps/reference","site_server":"apps/reference/server.js","image_tag":"latest"}]}' >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: resolve-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run env-safe unit tests
        run: npm run test:unit -- --exclude tests/unit/order-and-gls-services.test.ts

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image_name
        run: echo "value=$(echo '${{ github.repository_owner }}/webshop-engine' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image (${{ matrix.image_tag }})
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.value }}:${{ matrix.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.value }}:sha-${{ github.sha }}-${{ matrix.image_tag }}
          build-args: |
            SITE_APP=${{ matrix.site_app }}
            SITE_APP_SERVER=${{ matrix.site_server }}
            DATABASE_URL=mongodb://localhost:27017/build
            AUTH_GOOGLE_ID=build-placeholder
            AUTH_GOOGLE_SECRET=build-placeholder
            AUTH_SECRET=build-placeholder
            NEXTAUTH_URL=https://placeholder.example.com
            AUTH_TRUST_HOST=true
